# Repository-wide Python tooling configuration.
#
# This file intentionally declares no [project] table: it is not an installable
# package. Each Python package (packages/config, apps/api, apps/worker) has its
# own pyproject.toml. Keeping lint, type-check, and test settings here means all
# backend code is held to one standard.

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/config/src",
  "packages/ai-core/src",
  "packages/job-sources/src",
  "packages/prompts/src",
  "apps/api/src",
  "apps/worker/src",
]
extend-exclude = ["apps/api/migrations/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "C4",   # comprehensions
  "SIM",  # simplify
  "TID",  # tidy imports
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and long descriptive names.
"**/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["jip_ai", "jip_api", "jip_config", "jip_prompts", "jip_sources", "jip_worker"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = [
  "packages/config/src",
  "packages/ai-core/src",
  "packages/job-sources/src",
  "packages/prompts/src",
  "apps/api/src",
  "apps/worker/src",
]
files = [
  "packages/config/src",
  "packages/config/tests",
  "packages/ai-core/src",
  "packages/ai-core/tests",
  "packages/job-sources/src",
  "packages/job-sources/tests",
  "packages/prompts/src",
  "packages/prompts/tests",
  "apps/api/src",
  "apps/api/tests",
  "apps/api/migrations",
  "apps/worker/src",
  "apps/worker/tests",
  "scripts",
  "tests/evals",
]

[[tool.mypy.overrides]]
# Alembic generates these modules from a template; they are configuration, not
# library code, and Alembic's own context object is dynamically constructed.
module = ["migrations.*", "alembic.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# boto3 and botocore ship no type information. The typed stubs are a separate
# package that lags the runtime; the S3 adapter confines the untyped surface to
# one module and re-types its own boundary.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Imported lazily inside one adapter so the package stays usable without a
# provider SDK installed; the adapter re-types its own boundary.
module = ["anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Neither ships type information. Both are imported lazily inside the OCR
# adapters, which re-type their own boundary: rasterise yields `bytes` and the
# engine returns an `OcrResult`, so the untyped surface stops at two functions.
module = ["pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "packages/config/tests",
  "packages/ai-core/tests",
  "packages/job-sources/tests",
  "packages/prompts/tests",
  "apps/api/tests",
  "apps/worker/tests",
  "tests/evals",
]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires live PostgreSQL and/or Redis (see docs/development/local-environment.md)",
  "live_ai: calls a real model provider; skipped unless JIP_RUN_AI_EVALS=1 (see tests/evals/README.md)",
  "ocr: needs the tesseract binary, which the API image installs and a host usually does not",
]
filterwarnings = [
  "error",
  # Starlette's TestClient imports the `anyio.abc.BlockingPortal` alias, which
  # anyio has deprecated in favour of `anyio.from_thread.BlockingPortal`. The
  # warning fires while `apps/api/tests/conftest.py` is being imported, so
  # "error" turns somebody else's deprecation schedule into a collection
  # failure: pytest exits 4 and not one test runs.
  #
  # Named exactly rather than broadly, so this stops ignoring the day the
  # message changes. Remove it when starlette imports the new path.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = [
  "packages/config/src",
  "packages/ai-core/src",
  "packages/prompts/src",
  "apps/api/src",
  "apps/worker/src",
]

[tool.coverage.report]
show_missing = true
