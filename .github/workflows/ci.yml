name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests, migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jip
          POSTGRES_PASSWORD: jip_ci
          POSTGRES_DB: jip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jip -d jip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JIP_TEST_DATABASE_URL: postgresql+psycopg://jip:jip_ci@localhost:5432/jip
      JIP_TEST_REDIS_URL: redis://localhost:6379/0
      # Turns "infrastructure missing" from a silent skip into a failure, so a
      # broken service shows up as a red build rather than a shorter test run.
      JIP_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests
        run: pytest -m "not integration"

      - name: Integration tests (PostgreSQL, Redis, RQ worker)
        run: pytest -m integration

      - name: Alembic upgrade from a clean database
        env:
          JIP_DATABASE_URL: postgresql+psycopg://jip:jip_ci@localhost:5432/jip_migrations
          JIP_REDIS_URL: redis://localhost:6379/0
          PGPASSWORD: jip_ci
        working-directory: apps/api
        run: |
          psql -h localhost -U jip -d jip -c 'CREATE DATABASE jip_migrations'
          alembic upgrade head
          alembic current
          alembic downgrade base

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build
        run: npm run build

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build api web

      - name: Start the stack
        run: |
          docker compose up -d postgres redis minio
          # Bucket creation is a one-shot container; wait for it rather than
          # racing the API's first upload against it.
          docker compose up --exit-code-from minio-init minio-init
          docker compose up -d migrate api worker web

      - name: Wait for the API to report ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ready; then
              echo
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Wait for the web app to serve
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000 | grep -q "Job Intelligence Platform"; then
              echo "web serving after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "web app did not serve" >&2
          docker compose logs --no-color web
          exit 1

      - name: Verify migrations were applied
        run: |
          docker compose exec -T postgres \
            psql -U jip -d jip -tAc 'SELECT version_num FROM alembic_version' \
            | tee /dev/stderr | grep -q .

      - name: Verify the users table exists
        run: |
          docker compose exec -T postgres \
            psql -U jip -d jip -tAc "SELECT to_regclass('public.users')" \
            | tee /dev/stderr | grep -q users

      - name: Verify the resume import schema and worker task are reachable
        run: |
          docker compose exec -T api python - <<'PY'
          # The API enqueues by dotted path (ADR-0003), so a rename in the
          # worker is invisible until a real import runs. Importing it here
          # turns that into a build failure instead of a stuck job.
          import importlib

          from jip_api.application.resumes.imports import RESUME_IMPORT_TASK

          module_path, _, function_name = RESUME_IMPORT_TASK.rpartition(".")
          task = getattr(importlib.import_module(module_path), function_name)
          assert callable(task), RESUME_IMPORT_TASK

          from jip_prompts import RESUME_PARSER_LATEST, get_prompt

          assert get_prompt(RESUME_PARSER_LATEST).version >= 1
          print("resume import wiring ok:", RESUME_IMPORT_TASK, RESUME_PARSER_LATEST)
          PY

          docker compose exec -T postgres             psql -U jip -d jip -tAc             "SELECT to_regclass('public.processing_jobs'), to_regclass('public.ai_runs'),              to_regclass('public.document_extractions'), to_regclass('public.document_extraction_items')"             | tee /dev/stderr | grep -q "processing_jobs|ai_runs|document_extractions|document_extraction_items"

      - name: Verify the job workspace schema and worker task are reachable
        run: |
          docker compose exec -T api python - <<'PY'
          # Same dotted-path risk as the resume import above: a rename in the
          # worker only shows up when a real URL import runs.
          import importlib

          from jip_api.application.jobs.importing import FETCH_JOB_TASK

          module_path, _, function_name = FETCH_JOB_TASK.rpartition(".")
          task = getattr(importlib.import_module(module_path), function_name)
          assert callable(task), FETCH_JOB_TASK

          # The SSRF guard is the one piece of this phase that fails open if it
          # is ever accidentally disconnected, so CI exercises it directly
          # rather than trusting that the unit tests still import it.
          from jip_api.infrastructure.fetching.safety import UnsafeUrlError, validate_url

          for blocked in (
              "http://169.254.169.254/latest/meta-data/",
              "http://localhost:8000/api/v1/users/me",
              "file:///etc/passwd",
          ):
              try:
                  validate_url(blocked)
              except UnsafeUrlError:
                  continue
              raise AssertionError(f"SSRF guard allowed {blocked}")

          print("job workspace wiring ok:", FETCH_JOB_TASK)
          PY

          docker compose exec -T postgres \
            psql -U jip -d jip -tAc \
            "SELECT to_regclass('public.jobs'), to_regclass('public.job_imports')" \
            | tee /dev/stderr | grep -q "jobs|job_imports"

      - name: Verify the job analysis schema, prompts, and worker task are reachable
        run: |
          docker compose exec -T api python - <<'PY'
          # Same dotted-path risk again: a rename in the worker is invisible
          # until a real analysis runs.
          import importlib

          from jip_api.application.jobs.analysis_uc import ANALYZE_JOB_TASK

          module_path, _, function_name = ANALYZE_JOB_TASK.rpartition(".")
          task = getattr(importlib.import_module(module_path), function_name)
          assert callable(task), ANALYZE_JOB_TASK

          # Both operations must be routable. An unrouted one raises only when
          # a user asks for an analysis, which is far too late to find out.
          from jip_ai import AIOperation
          from jip_api.infrastructure.ai import build_model_router
          from jip_config import get_settings

          router = build_model_router(get_settings())
          for operation in (AIOperation.JOB_PARSE, AIOperation.JOB_ANALYSIS):
              assert router.route(operation).model, operation

          from jip_prompts import JOB_ANALYSIS_LATEST, JOB_PARSER_LATEST, get_prompt

          for name in (JOB_PARSER_LATEST, JOB_ANALYSIS_LATEST):
              assert get_prompt(name).version >= 1, name

          print("job analysis wiring ok:", ANALYZE_JOB_TASK, JOB_PARSER_LATEST, JOB_ANALYSIS_LATEST)
          PY

          docker compose exec -T postgres \
            psql -U jip -d jip -tAc \
            "SELECT to_regclass('public.job_analyses'), to_regclass('public.job_requirements'),
             to_regclass('public.job_responsibilities')" \
            | tee /dev/stderr | grep -q "job_analyses|job_requirements|job_responsibilities"

      - name: Verify the matching engine schema and rules are reachable
        run: |
          docker compose exec -T api python - <<'PY'
          # The matching engine is deterministic and versioned, so the thing
          # worth asserting in CI is that its rules are intact and its version
          # is recorded — a silently reverted weight would change every score
          # without changing any test that mocks the rules.
          from jip_api.domain.matching.rules import MATCHING_ENGINE_VERSION, STATUS_SCORES
          from jip_api.domain.matching.models import MatchStatus
          from jip_api.domain.matching.transferable import find_transfer

          assert MATCHING_ENGINE_VERSION
          assert set(STATUS_SCORES) == set(MatchStatus), "a status has no score"

          # Semantic similarity is not equivalence: a transferable link must
          # never be reported as the same skill.
          transfer = find_transfer("Spring Boot", ["FastAPI"])
          assert transfer is not None, "FastAPI should transfer to Spring Boot"
          assert find_transfer("Java", ["Python"]) is None, "Python must not transfer to Java"

          from jip_ai import AIOperation
          from jip_api.infrastructure.ai import build_model_router
          from jip_config import get_settings

          assert build_model_router(get_settings()).route(AIOperation.MATCH_EXPLAIN).model

          print("matching engine wiring ok:", MATCHING_ENGINE_VERSION)
          PY

          docker compose exec -T postgres             psql -U jip -d jip -tAc             "SELECT to_regclass('public.job_matches'), to_regclass('public.job_match_items'),
             to_regclass('public.job_match_evidence')"             | tee /dev/stderr | grep -q "job_matches|job_match_items|job_match_evidence"

      - name: Verify object storage round-trips through the API's adapter
        run: |
          docker compose exec -T api python - <<'PY'
          from jip_api.infrastructure.storage.s3 import get_object_storage

          storage = get_object_storage()
          key = "ci/roundtrip.txt"
          payload = b"phase-3 storage check"

          stored = storage.upload(key, payload, content_type="text/plain")
          assert stored.size_bytes == len(payload), stored

          assert storage.download(key) == payload, "downloaded bytes differ"

          url = storage.create_signed_url(key, expires_in_seconds=60)
          assert "X-Amz-Signature" in url, f"url is not signed: {url}"

          storage.delete(key)
          storage.delete(key)  # deleting a missing key must not raise

          print("object storage round-trip OK; signed url issued")
          PY

      - name: Verify a protected endpoint rejects an unauthenticated request
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/users/me)
          echo "GET /api/v1/users/me without a token -> HTTP ${status}"
          test "${status}" = "401"

      - name: Verify the worker processes a queued task
        run: |
          docker compose exec -T api python - <<'PY'
          import sys, time
          from redis import Redis
          from rq import Queue
          from rq.job import JobStatus

          queue = Queue("default", connection=Redis.from_url("redis://redis:6379/0"))
          job = queue.enqueue("jip_worker.tasks.system.ping", "ci")

          for _ in range(60):
              status = job.get_status(refresh=True)
              if status == JobStatus.FINISHED:
                  print("worker returned:", job.return_value())
                  assert job.return_value()["echo"] == "ci"
                  sys.exit(0)
              if status == JobStatus.FAILED:
                  print("job failed:", job.latest_result(), file=sys.stderr)
                  sys.exit(1)
              time.sleep(1)

          print(f"job did not finish (last status: {status})", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
