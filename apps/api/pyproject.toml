[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jip-api"
version = "0.1.0"
description = "Job Intelligence Platform HTTP API."
requires-python = ">=3.12"
dependencies = [
  "jip-config",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<7",
  "rq>=1.16,<3",
  "pyjwt[crypto]>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jip_api"]
