[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jip-api"
version = "0.1.0"
description = "Job Intelligence Platform HTTP API."
requires-python = ">=3.12"
dependencies = [
  "jip-config",
  "jip-ai-core",
  "jip-prompts",
  "jip-job-sources",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<7",
  "rq>=1.16,<3",
  "pyjwt[crypto]>=2.9,<3",
  "boto3>=1.35,<2",
  # Multipart parsing for file uploads. FastAPI needs it to accept UploadFile.
  "python-multipart>=0.0.9,<1",
  # PDF text extraction. Pure Python, no system libraries, and it is the one
  # format whose parsing cannot reasonably be written here. DOCX needs no
  # dependency — it is a ZIP of XML, handled with the standard library.
  "pypdf>=5.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jip_api"]
