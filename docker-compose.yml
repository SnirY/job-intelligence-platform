# Local development stack: web, api, worker, PostgreSQL, Redis.
#
#   cp .env.example .env
#   docker compose up --build
#
# The API and worker read JIP_DATABASE_URL / JIP_REDIS_URL with container
# hostnames, overriding the localhost values in .env that a host-run process
# would use.

name: job-intelligence-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jip_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-jip}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Dependents wait for readiness, not just for the container to exist.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jip} -d ${POSTGRES_DB:-jip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for uploaded documents. Real S3 semantics
  # locally — signed URLs and content types behave as they will in production,
  # which a filesystem shortcut would not.
  # Pulled from quay.io and pinned. Docker Hub began refusing `minio/minio`
  # with "pull access denied ... repository does not exist", which took the
  # Compose job down on code that had not changed. `:latest` on somebody else's
  # image is an unpinned dependency in a project that pins everything else.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${JIP_STORAGE_ACCESS_KEY:-jip_local_dev_only}
      MINIO_ROOT_PASSWORD: ${JIP_STORAGE_SECRET_KEY:-jip_local_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot bucket creation. MinIO has no declarative bucket config, so the
  # alternative is every developer creating it by hand and CI failing until
  # someone remembers.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      ${JIP_STORAGE_ACCESS_KEY:-jip_local_dev_only}
      ${JIP_STORAGE_SECRET_KEY:-jip_local_dev_only} &&
      mc mb --ignore-existing local/${JIP_STORAGE_BUCKET:-jip-documents} &&
      echo 'bucket ready'
      "

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    working_dir: /app/apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      JIP_ENVIRONMENT: ${JIP_ENVIRONMENT:-local}
      JIP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jip}:${POSTGRES_PASSWORD:-jip_local_dev_only}@postgres:5432/${POSTGRES_DB:-jip}
      JIP_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      JIP_ENVIRONMENT: ${JIP_ENVIRONMENT:-local}
      JIP_LOG_LEVEL: ${JIP_LOG_LEVEL:-INFO}
      JIP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jip}:${POSTGRES_PASSWORD:-jip_local_dev_only}@postgres:5432/${POSTGRES_DB:-jip}
      JIP_REDIS_URL: redis://redis:6379/0
      JIP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      # DEV-068. Without these the API starts, reports ready, and answers 503 to
      # every authenticated request: `resolved_auth_jwks_url` raises when no
      # issuer is set, so the token verifier cannot be built. An anonymous
      # request still returns 401 — it is rejected before the verifier is
      # needed — which is why the smoke test in CI passed for weeks while the
      # stack could not serve one signed-in user.
      #
      # No default. A blank issuer is the broken state, and `${VAR:-}` would
      # spell it as a supported configuration.
      JIP_AUTH_PROVIDER: ${JIP_AUTH_PROVIDER:-clerk}
      JIP_AUTH_ISSUER: ${JIP_AUTH_ISSUER:?set JIP_AUTH_ISSUER in .env — the API cannot verify tokens without it}
      JIP_AUTH_AUTHORIZED_PARTIES: ${JIP_AUTH_AUTHORIZED_PARTIES:-http://localhost:3000}
      JIP_AUTH_JWKS_URL: ${JIP_AUTH_JWKS_URL:-}
      JIP_STORAGE_BUCKET: ${JIP_STORAGE_BUCKET:-jip-documents}
      JIP_STORAGE_ENDPOINT_URL: http://minio:9000
      JIP_STORAGE_ACCESS_KEY: ${JIP_STORAGE_ACCESS_KEY:-jip_local_dev_only}
      JIP_STORAGE_SECRET_KEY: ${JIP_STORAGE_SECRET_KEY:-jip_local_dev_only}
      JIP_AI_PROVIDER: ${JIP_AI_PROVIDER:-anthropic}
      JIP_AI_API_KEY: ${JIP_AI_API_KEY:-}
      JIP_AI_RESUME_PARSE_MODEL: ${JIP_AI_RESUME_PARSE_MODEL:-claude-opus-5}
      JIP_JOB_FETCH_TIMEOUT_SECONDS: ${JIP_JOB_FETCH_TIMEOUT_SECONDS:-15}
      JIP_JOB_FETCH_MAX_BYTES: ${JIP_JOB_FETCH_MAX_BYTES:-3145728}
      JIP_AI_JOB_PARSE_MODEL: ${JIP_AI_JOB_PARSE_MODEL:-}
      JIP_AI_JOB_ANALYSIS_MODEL: ${JIP_AI_JOB_ANALYSIS_MODEL:-}
      JIP_AI_MATCH_EXPLAIN_MODEL: ${JIP_AI_MATCH_EXPLAIN_MODEL:-}
      JIP_AI_RESUME_STRATEGY_MODEL: ${JIP_AI_RESUME_STRATEGY_MODEL:-}
      JIP_AI_RESUME_REWRITE_MODEL: ${JIP_AI_RESUME_REWRITE_MODEL:-}
    ports:
      - "${JIP_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["jip-worker"]
    environment:
      JIP_ENVIRONMENT: ${JIP_ENVIRONMENT:-local}
      JIP_LOG_LEVEL: ${JIP_LOG_LEVEL:-INFO}
      JIP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jip}:${POSTGRES_PASSWORD:-jip_local_dev_only}@postgres:5432/${POSTGRES_DB:-jip}
      JIP_REDIS_URL: redis://redis:6379/0
      JIP_WORKER_QUEUES: ${JIP_WORKER_QUEUES:-default}
      JIP_STORAGE_BUCKET: ${JIP_STORAGE_BUCKET:-jip-documents}
      JIP_STORAGE_ENDPOINT_URL: http://minio:9000
      JIP_STORAGE_ACCESS_KEY: ${JIP_STORAGE_ACCESS_KEY:-jip_local_dev_only}
      JIP_STORAGE_SECRET_KEY: ${JIP_STORAGE_SECRET_KEY:-jip_local_dev_only}
      JIP_AI_PROVIDER: ${JIP_AI_PROVIDER:-anthropic}
      JIP_AI_API_KEY: ${JIP_AI_API_KEY:-}
      JIP_AI_RESUME_PARSE_MODEL: ${JIP_AI_RESUME_PARSE_MODEL:-claude-opus-5}
      # The worker is what actually opens a user-supplied link, so these two
      # limits matter most here.
      JIP_JOB_FETCH_TIMEOUT_SECONDS: ${JIP_JOB_FETCH_TIMEOUT_SECONDS:-15}
      JIP_JOB_FETCH_MAX_BYTES: ${JIP_JOB_FETCH_MAX_BYTES:-3145728}
      JIP_AI_JOB_PARSE_MODEL: ${JIP_AI_JOB_PARSE_MODEL:-}
      JIP_AI_JOB_ANALYSIS_MODEL: ${JIP_AI_JOB_ANALYSIS_MODEL:-}
      JIP_AI_MATCH_EXPLAIN_MODEL: ${JIP_AI_MATCH_EXPLAIN_MODEL:-}
      JIP_AI_RESUME_STRATEGY_MODEL: ${JIP_AI_RESUME_STRATEGY_MODEL:-}
      JIP_AI_RESUME_REWRITE_MODEL: ${JIP_AI_RESUME_REWRITE_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    # DEV-068. Clerk's keys live here and not in the root `.env`, because this
    # is the file Next already reads when the dev server runs on the host — and
    # it is **not** in the image, so the containerised web app rendered a shell
    # that could never sign anyone in. Read the file rather than restating its
    # values above: one copy of a secret is one place to rotate it.
    env_file:
      - apps/web/.env.local
    environment:
      # Listed after `env_file` and therefore authoritative over it. The file's
      # own copy of this is written for the host dev server; from a container
      # the browser still resolves it, so it must stay a host URL.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${JIP_API_PORT:-8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
